
<!DOCTYPE html>
<html ng-app="votingApp">
<head>
    <title>Online Voting System</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="VotingController">

<h2>Online Voting System</h2>

<form ng-submit="addCandidate()">
    <input ng-model="name" placeholder="Candidate Name" required>
    <input ng-model="party" placeholder="Party Name" required>
    <button type="submit">Add Candidate</button>
</form>

<br>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Party</th>
        <th>Votes</th>
        <th>Actions</th>
    </tr>

    <tr ng-repeat="c in candidates">
        <td>{{c.name}}</td>
        <td>{{c.party}}</td>
        <td>{{c.votes}}</td>
        <td>
            <button ng-click="vote(c)">Vote</button>
            <button ng-click="edit(c)">Edit</button>
            <button ng-click="remove(c)">Delete</button>
        </td>
    </tr>
</table>

<p>{{message}}</p>

<script>
var app = angular.module("votingApp", []);

app.controller("VotingController", function($scope, $http) {

    var api = "http://localhost:5000/candidates";
    $scope.candidates = [];

    $scope.load = function() {
        $http.get(api).then(function(res) {
            $scope.candidates = res.data;
        });
    };

    $scope.addCandidate = function() {
        $http.post(api, {
            name: $scope.name,
            party: $scope.party
        }).then(function() {
            $scope.name = "";
            $scope.party = "";
            $scope.message = "Candidate added!";
            $scope.load();
        });
    };

    $scope.edit = function(c) {
        var name = prompt("Enter candidate name", c.name);
        if (name === null || name.trim() === "") return;

        var party = prompt("Enter party name", c.party);
        if (party === null || party.trim() === "") return;

        $http.put(api + "/" + c._id, {
            name: name,
            party: party
        }).then(function() {
            $scope.message = "Candidate updated!";
            $scope.load();
        });
    };

    $scope.remove = function(c) {
        if (confirm("Delete candidate?")) {
            $http.delete(api + "/" + c._id).then(function() {
                $scope.message = "Candidate deleted!";
                $scope.load();
            });
        }
    };

    $scope.vote = function(c) {
        $http.post(api + "/" + c._id + "/vote").then(function() {
            $scope.message = "Vote recorded!";
            $scope.load();
        });
    };

    $scope.load();
});
</script>

</body>
</html>
